<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Azanco — Discount Link Generator</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0F172A;
    color: white;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.hint { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-top: 16px; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: white;
    font-size: 15px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #2AB364;
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #result {
    margin-top: 24px;
    padding: 16px;
    background: #1e293b;
    border-radius: 8px;
    word-break: break-all;
    font-size: 13px;
    display: none;
  }
  #result.show { display: block; }
  #result a { color: #2AB364; }
  #error {
    margin-top: 16px;
    padding: 12px;
    background: #7f1d1d;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  #error.show { display: block; }
  .copyBtn {
    margin-top: 10px;
    background: #334155;
    padding: 8px 12px;
    font-size: 13px;
    width: auto;
  }
</style>
</head>
<body>
  <h1>Discount Link Generator</h1>
  <p class="hint">Internal use only. Generates a secure, signed PayFast checkout link at a custom monthly rate for a specific client.</p>

  <label for="adminSecret">Admin Password</label>
  <input type="password" id="adminSecret" placeholder="Your admin password" />

  <label for="clientEmail">Client Email</label>
  <input type="email" id="clientEmail" placeholder="client@example.com" />

  <label for="amount">Monthly Rate (ZAR, e.g. 1322.00)</label>
  <input type="number" id="amount" step="0.01" placeholder="1322.00" />

  <label for="description">Description (optional, shows on their PayFast receipt)</label>
  <input type="text" id="description" placeholder="e.g. Marketing Partner Rate" />

  <button id="generateBtn" onclick="generateLink()">Generate Secure Link</button>

  <div id="error"></div>
  <div id="result"></div>

  <script>
    let lastGeneratedUrl = '';

    async function generateLink() {
      const btn = document.getElementById('generateBtn');
      const errorDiv = document.getElementById('error');
      const resultDiv = document.getElementById('result');
      errorDiv.classList.remove('show');
      resultDiv.classList.remove('show');

      const adminSecret = document.getElementById('adminSecret').value;
      const clientEmail = document.getElementById('clientEmail').value.trim();
      const amount = document.getElementById('amount').value;
      const description = document.getElementById('description').value.trim();

      if (!adminSecret || !clientEmail || !amount) {
        errorDiv.textContent = 'Please fill in password, client email, and amount.';
        errorDiv.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating…';

      try {
        const response = await fetch('https://quotesnap-backend-v2.vercel.app/api/generate-discount-checkout-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminSecret, clientEmail, amount, description }),
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Something went wrong');
        }

        lastGeneratedUrl = data.url;

        const titleEl = document.createElement('strong');
        titleEl.textContent = 'Link for ' + data.clientEmail + ' — R' + data.amount + '/month';

        const linkEl = document.createElement('a');
        linkEl.href = data.url;
        linkEl.target = '_blank';
        linkEl.rel = 'noopener noreferrer';
        linkEl.textContent = data.url;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copyBtn';
        copyBtn.textContent = 'Copy Link';
        copyBtn.addEventListener('click', copyLink);

        resultDiv.innerHTML = '';
        resultDiv.appendChild(titleEl);
        resultDiv.appendChild(document.createElement('br'));
        resultDiv.appendChild(document.createElement('br'));
        resultDiv.appendChild(linkEl);
        resultDiv.appendChild(document.createElement('br'));
        resultDiv.appendChild(copyBtn);
        resultDiv.classList.add('show');
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Secure Link';
      }
    }

    function copyLink() {
      navigator.clipboard.writeText(lastGeneratedUrl);
      alert('Link copied!');
    }
  </script>
</body>
</html>
